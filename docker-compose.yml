version: '3.9'

services:
  evently.api:
    image: ${DOCKER_REGISTRY-}eventlyapi
    container_name: Evently.Api
    build:
      context: .
      dockerfile: Evently.Api/Dockerfile
    ports:
      - 5000:8000
      - 5001:8001

  evently.database:
    image: postgres:18
    container_name: Evently.Database
    environment:
      - POSTGRES_DB=evently
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=maja
    volumes:
      - ./.containers/db:/var/lib/postgresql
    ports:
      - 5432:5432

  evently.seq:
    image: datalust/seq:latest
    container_name: Evently.Seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 5341:5341
      - 8081:80